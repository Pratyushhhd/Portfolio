        /* ===== NAVBAR COMPONENT ===== */

        /* ===== TYPING HOOK ===== */
        function useTypingEffect(words, typingSpeed = 100, deletingSpeed = 60, pause = 2000) {
            const [text, setText] = useState('');
            const [showCursor, setShowCursor] = useState(true);

            useEffect(() => {
                let wordIndex = 0;
                let charIndex = 0;
                let isDeleting = false;
                let timeout;

                const type = () => {
                    const word = words[wordIndex];
                    if (!isDeleting && charIndex <= word.length) {
                        setText(word.substring(0, charIndex));
                        charIndex++;
                        timeout = setTimeout(type, typingSpeed);
                    } else if (isDeleting && charIndex >= 0) {
                        setText(word.substring(0, charIndex));
                        charIndex--;
                        timeout = setTimeout(type, deletingSpeed);
                    } else {
                        isDeleting = !isDeleting;
                        if (!isDeleting) wordIndex = (wordIndex + 1) % words.length;
                        timeout = setTimeout(type, isDeleting ? pause : 500);
                    }
                };

                // Blinking cursor
                const cursorInterval = setInterval(() => {
                    setShowCursor(prev => !prev);
                }, 530);

                timeout = setTimeout(type, 500);

                return () => {
                    clearTimeout(timeout);
                    clearInterval(cursorInterval);
                };
            }, []);

            return { text, showCursor };
        }

        /* ===== CONTACT COMPONENT ===== */

        /* ===== FOOTER COMPONENT ===== */

                        <p style={{ fontSize: '0.8rem', marginTop: 4 }}>
                            Built with <i className="fas fa-heart" style={{ color: 'var(--accent)' }}></i> using React &amp; Bootstrap
                        </p>
                    </div>
                </footer>
            );
        }

        /* ===== APP ===== */
        function App() {
            const [activeSection, setActiveSection] = useState('home');
            const [theme, setTheme] = useState(() => {
                return localStorage.getItem('theme') || 'dark';
            });

            // Apply theme to body
            useEffect(() => {
                document.body.className = theme === 'dark' ? 'dark-mode' : '';
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
            }, [theme]);

            // Scroll spy
            useEffect(() => {
                const sections = ['home', 'about', 'skills', 'projects', 'contact'];
                const obs = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setActiveSection(entry.target.id);
                        }
                    });
                }, { rootMargin: '-50% 0px -50% 0px' });

                sections.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) obs.observe(el);
                });

                return () => obs.disconnect();
            }, []);

            const toggleTheme = useCallback(() => {
                setTheme(prev => prev === 'dark' ? 'light' : 'dark');
            }, []);

            return (
                <>
                    <Navbar activeSection={activeSection} theme={theme} toggleTheme={toggleTheme} />
                    <Home />
                    <About />
                    <Skills />
                    <Projects />
                    <Contact />
                    <Footer />
                </>
            );
        }

        /* ===== MOUNT ===== */
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
