<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pratyush Maharjan | Frontend Developer</title>

    <!-- Set theme before first paint to avoid flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>

    <meta name="description" content="Portfolio of Pratyush Maharjan, a frontend developer from Kathmandu, Nepal building fast, accessible web experiences with React, JavaScript and modern CSS." />
    <link rel="canonical" href="https://www.maharjanpratyush.com.np/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.maharjanpratyush.com.np/" />
    <meta property="og:title" content="Pratyush Maharjan | Frontend Developer" />
    <meta property="og:description" content="Frontend developer crafting fast, clean web experiences with React and modern CSS." />
    <meta property="og:image" content="https://www.maharjanpratyush.com.np/pratyush.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Pratyush Maharjan | Frontend Developer" />
    <meta name="twitter:description" content="Frontend developer crafting fast, clean web experiences with React and modern CSS." />
    <meta name="twitter:image" content="https://www.maharjanpratyush.com.np/pratyush.jpg" />

    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
